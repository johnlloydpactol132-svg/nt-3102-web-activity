<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Activity 1 - Register</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,sans-serif}
.page{min-height:100vh;display:grid;place-items:center;padding:25px;color:#fff;
background:linear-gradient(rgba(24,45,65,.32),rgba(24,45,65,.42)),
url("https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=1800&q=85") center/cover}
.box{width:420px;padding:35px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);
border-radius:16px;backdrop-filter:blur(10px);text-align:center}
h1{margin-bottom:25px}input{width:100%;padding:13px 15px;border:0;border-radius:8px;margin:7px 0;outline:none}
button{width:100%;padding:13px;margin-top:14px;border:0;border-radius:8px;cursor:pointer;font-weight:bold}
p{font-size:13px;margin-top:18px}a{color:#fff}
@media(max-width:600px){.box{width:100%;max-width:360px;padding:28px 20px}}
</style>
</head>
<body><section class="page"><main class="box">
<h1>Create Account</h1>
<form><input type="text" placeholder="Full name" required><input type="email" placeholder="Email address" required>
<input type="password" placeholder="Password" required><input type="password" placeholder="Confirm password" required>
<button type="submit">CREATE ACCOUNT</button></form>
<p>Already have an account? <a href="#">Login</a></p>
</main></section></body></html>
