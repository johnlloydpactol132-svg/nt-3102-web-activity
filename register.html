<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register</title>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif}
.page{min-height:100vh;display:grid;place-items:center;padding:25px;color:#fff;background:linear-gradient(rgba(24,45,65,.32),rgba(24,45,65,.42)),url("https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=1800&q=85") center/cover}
.box{width:420px;padding:35px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);border-radius:16px;backdrop-filter:blur(10px);text-align:center}
h1{margin-bottom:25px}
input{width:100%;padding:13px 15px;border:0;border-radius:8px;margin:7px 0;outline:none}
button{width:100%;padding:13px;margin-top:14px;border:0;border-radius:8px;cursor:pointer;font-weight:bold}
.message{margin-top:15px;font-size:14px;font-weight:bold}
.success{color:#8cff9b}.error{color:#ff8c8c}
p{font-size:13px;margin-top:18px} a{color:#fff}
</style>
</head>
<body>
<section class="page">
<main class="box">
<h1>Create Account</h1>
<form id="registerForm">
<input type="text" id="fullname" placeholder="Full name" required>
<input type="email" id="email" placeholder="Email address" required>
<input type="password" id="password" placeholder="Password" required>
<input type="password" id="confirmPassword" placeholder="Confirm password" required>
<button type="submit">CREATE ACCOUNT</button>
</form>
<div id="message" class="message"></div>
<p>Already have an account? <a href="login.html">Login</a></p>
</main>
</section>

<script>
$(document).ready(function(){
    $("#registerForm").submit(function(e){
        e.preventDefault();

        let fullname = $("#fullname").val().trim();
        let email = $("#email").val().trim();
        let password = $("#password").val();
        let confirmPassword = $("#confirmPassword").val();

        if(password !== confirmPassword){
            $("#message").removeClass("success").addClass("error")
                .text("Passwords do not match!");
            return;
        }

        let existingUser = localStorage.getItem("registeredUser");

        if(existingUser){
            let user = JSON.parse(existingUser);
            if(user.email === email){
                $("#message").removeClass("success").addClass("error")
                    .text("Email is already registered!");
                return;
            }
        }

        let newUser = {
            fullname: fullname,
            email: email,
            password: password
        };

        localStorage.setItem("registeredUser", JSON.stringify(newUser));
        localStorage.setItem("loginAttempts", "0");

        $("#message").removeClass("error").addClass("success")
            .text("Registration successful!");

        $("#registerForm")[0].reset();
    });
});
</script>
</body>
</html>
