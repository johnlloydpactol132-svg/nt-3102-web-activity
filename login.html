<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif}
.page{min-height:100vh;display:flex;justify-content:center;align-items:center;padding:25px;color:white;text-align:center;background:linear-gradient(rgba(24,55,68,.22),rgba(24,55,68,.35)),url("https://images.unsplash.com/photo-1510798831971-661eb04b3739?auto=format&fit=crop&w=1800&q=85") center/cover}
.login{width:390px;padding:35px 30px;background:rgba(20,45,55,.22);border:1px solid rgba(255,255,255,.35);border-radius:12px;backdrop-filter:blur(8px);box-shadow:0 8px 30px rgba(0,0,0,.18)}
h1{font-size:30px;margin-bottom:8px}.subtitle{font-size:14px;margin-bottom:28px}
input{width:100%;padding:13px 16px;margin:8px 0;border:0;border-radius:25px;outline:none;background:rgba(255,255,255,.88)}
.options{display:flex;justify-content:space-between;font-size:12px;margin:8px 0 20px}
.options label{display:flex;gap:5px;align-items:center}.options input{width:auto;margin:0}
a{color:white;text-decoration:none}
button{width:100%;padding:13px;border:0;border-radius:25px;font-size:15px;cursor:pointer}
button:disabled{background:#777;cursor:not-allowed}
.bottom{margin-top:18px;font-size:13px}
.message{margin-top:15px;font-size:14px;font-weight:bold}
.success{color:#8cff9b}.error{color:#ff8c8c}
.attempts{margin-top:10px;font-size:12px}
@media(max-width:600px){.page{align-items:flex-start;padding-top:80px}.login{width:100%;max-width:360px;padding:28px 20px}h1{font-size:25px}}
</style>
</head>
<body>
<section class="page">
<main class="login">
<h1>Welcome</h1>
<p class="subtitle">Sign in to continue your journey</p>

<form id="loginForm">
<input type="email" id="loginEmail" placeholder="Email address" required>
<input type="password" id="loginPassword" placeholder="Password" required>

<div class="options">
<label><input type="checkbox"> Remember me</label>
<a href="#">Forgot password?</a>
</div>

<button type="submit" id="loginButton">LOGIN</button>
</form>

<div id="message" class="message"></div>
<div id="attempts" class="attempts"></div>

<p class="bottom">Don't have an account? <a href="register.html"><b>Sign up</b></a></p>
</main>
</section>

<script>
$(document).ready(function(){
    const MAX_ATTEMPTS = 4;
    let attempts = parseInt(localStorage.getItem("loginAttempts")) || 0;

    if(attempts >= MAX_ATTEMPTS){
        $("#loginButton").prop("disabled", true);
        $("#message").addClass("error")
            .text("Login disabled. You reached 4 failed attempts.");
        $("#attempts").text("Failed attempts: 4 / 4");
    }else{
        $("#attempts").text("Failed attempts: " + attempts + " / " + MAX_ATTEMPTS);
    }

    $("#loginForm").submit(function(e){
        e.preventDefault();

        let storedUser = localStorage.getItem("registeredUser");

        if(!storedUser){
            $("#message").removeClass("success").addClass("error")
                .text("No registered account found.");
            return;
        }

        let user = JSON.parse(storedUser);
        let email = $("#loginEmail").val().trim();
        let password = $("#loginPassword").val();

        if(email === user.email && password === user.password){
            localStorage.setItem("loginAttempts", "0");

            $("#message").removeClass("error").addClass("success")
                .text("Login successful! Welcome, " + user.fullname + "!");
            $("#attempts").text("");
        }else{
            attempts++;
            localStorage.setItem("loginAttempts", attempts);

            if(attempts >= MAX_ATTEMPTS){
                $("#loginButton").prop("disabled", true);
                $("#message").removeClass("success").addClass("error")
                    .text("Login disabled! You reached 4 failed attempts.");
                $("#attempts").text("Failed attempts: 4 / 4");
            }else{
                let remaining = MAX_ATTEMPTS - attempts;
                $("#message").removeClass("success").addClass("error")
                    .text("Incorrect email or password.");
                $("#attempts").text(
                    "Failed attempts: " + attempts + " / " + MAX_ATTEMPTS +
                    " — " + remaining + " attempt(s) remaining."
                );
            }
        }
    });
});
</script>
</body>
</html>
